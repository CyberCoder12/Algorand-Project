<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon background representing blockchain -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" 
           fill="url(#grad1)" stroke="none"/>
  
  <!-- Inner hexagon -->
  <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" 
           fill="none" stroke="white" stroke-width="2" opacity="0.3"/>
  
  <!-- Ballot box -->
  <rect x="35" y="40" width="30" height="25" rx="3" fill="white"/>
  
  <!-- Ballot slot -->
  <rect x="40" y="38" width="20" height="4" rx="1" fill="url(#grad1)"/>
  
  <!-- Checkmark on ballot -->
  <path d="M42 52 L47 58 L58 46" stroke="url(#grad2)" stroke-width="4" 
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Voting hand/icon above box -->
  <circle cx="50" cy="28" r="6" fill="url(#grad2)"/>
  <path d="M50 22 L50 34" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Blockchain nodes -->
  <circle cx="25" cy="50" r="4" fill="white" opacity="0.8"/>
  <circle cx="75" cy="50" r="4" fill="white" opacity="0.8"/>
  <circle cx="35" cy="75" r="3" fill="white" opacity="0.6"/>
  <circle cx="65" cy="75" r="3" fill="white" opacity="0.6"/>
  
  <!-- Connecting lines -->
  <line x1="29" y1="50" x2="35" y2="50" stroke="white" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="50" x2="71" y2="50" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>